name: Update Exchange Rates (2x Daily)

on:
  schedule:
    # 하루 2회 실행: 00:00 UTC (09:00 KST), 12:00 UTC (21:00 KST)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update exchange rates snapshot
        run: npm run rates:update

      - name: Commit exchange rate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rates.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(rates): update twice-daily exchange rates"
            git push
          fi
